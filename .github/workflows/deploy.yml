name: Build prices and deploy

on:
  schedule:
    # 05:10 UTC — after the upstream scrape has settled overnight.
    - cron: "10 5 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Never let a nightly build and a manual push fight over the same deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Assemble the site
        run: |
          mkdir -p dist
          cp -r site/. dist/
          ls -la dist/

      # This workflow runs on every push, and the fetch pulls a 20 MB+ dataset
      # each time. Editing the app ten times in an evening therefore meant ten
      # downloads of a file that changes once a day. Caching it by date means
      # the upstream source is touched once per day no matter how often the
      # site is redeployed, which is both faster and better manners.
      - name: Today's date, for the cache key
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Reuse today's price data if we already have it
        id: cache
        uses: actions/cache@v4
        with:
          path: dist/data
          key: prices-${{ steps.day.outputs.d }}

      - name: Fetch and slim the price data
        if: steps.cache.outputs.cache-hit != 'true'
        run: node tools/build-data.mjs
        env:
          OUT_DIR: dist/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
